<script>
(function(){
  var totalSec=595;var el=document.getElementById('countdown');var bar=document.getElementById('progress-bar');
  if(!el)return;var startTotal=totalSec;
  function tick(){
    if(totalSec<=0){el.textContent='0:00';if(bar)bar.style.width='0%';return;}
    totalSec--;var m=Math.floor(totalSec/60);var s=totalSec%60;
    el.textContent=m+':'+(s<10?'0':'')+s;
    if(bar)bar.style.width=((totalSec/startTotal)*100)+'%';
    setTimeout(tick,1000);
  }
  tick();
})();
</script>

</body>
</html>
